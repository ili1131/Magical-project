<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞利浦收货核对</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6f9; color: #1a1a2e; }
  header { background: #0b5ed7; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .badge { background: rgba(255,255,255,.2); border-radius: 20px; padding: 3px 10px; font-size: 12px; }
  main { max-width: 960px; margin: 0 auto; padding: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

  .btn { display: inline-block; border: none; border-radius: 10px; padding: 12px 18px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: inherit; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-primary { background: #0b5ed7; color: #fff; }
  .btn-success { background: #198754; color: #fff; }
  .btn-danger  { background: #dc3545; color: #fff; }
  .btn-secondary { background: #6c757d; color: #fff; }
  .btn-warning { background: #fd7e14; color: #fff; }
  .btn-info { background: #0dcaf0; color: #05323a; }
  .btn-dark { background: #343a40; color: #fff; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-grid .btn {
    margin: 0; width: 100%; padding: 14px 8px; font-size: 14px;
    text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.2;
  }
  .btn-grid .btn.span-2 { grid-column: 1 / -1; }

  #restoreBanner {
    display: none; background: #d1e7dd; color: #0f5132;
    border: 1px solid #a3cfbb; border-radius: 10px;
    padding: 10px 12px; font-size: 13px; line-height: 1.6;
    margin-bottom: 14px; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  #restoreBanner .spacer { flex: 1; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: #f0f4fa; border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }

  #readerWrap { display: none; margin-bottom: 14px; }
  #reader { position: relative; width: 100%; max-width: 480px; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; }
  #reader video { width: 100%; display: block; background: #000; object-fit: cover; }
  .scan-frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 82%; height: 40%; border: 2px solid rgba(255,80,80,.9); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.2); pointer-events: none; z-index: 10; }
  .scan-frame::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(255,80,80,.85); animation: scanline 2s ease-in-out infinite; }
  @keyframes scanline { 0%,100% { top: 8%; } 50% { top: 92%; } }

  #logCard { display: none; }
  .log { max-height: 180px; overflow-y: auto; font-size: 13px; }
  .log .ok { color: #198754; }
  .log .dup { color: #fd7e14; }
  .log .miss { color: #dc3545; }

  table { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
  th, td { border: 1px solid #e3e7ee; padding: 7px 8px; text-align: left; white-space: nowrap; }
  th { background: #eef2f8; position: sticky; top: 0; z-index: 1; }
  tr.matched td { background: #ffe3e3 !important; color: #b02a37; font-weight: 700; }
  .table-wrap { max-height: 50vh; overflow: auto; border-radius: 8px; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
  .hint { color: #666; font-size: 13px; line-height: 1.6; }
  #fileName { font-size: 13px; color: #0b5ed7; margin-left: 6px; word-break: break-all; }
  #uploadBusy { display: none; margin-left: 8px; font-size: 13px; color: #0b5ed7; }

  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(0,0,0,.88); color: #fff; padding: 14px 22px; border-radius: 18px;
    font-size: 15px; display: none; z-index: 99; max-width: 90vw; text-align: center;
    line-height: 1.6; word-break: break-word; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .toast .head { font-size: 16px; font-weight: 700; }
  .toast .info { display: block; font-size: 13px; font-weight: 400; color: #ffd75e; margin-top: 6px; }
  #loadStatus { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100; font-size: 15px; color: #333; }
  .spinner { width: 36px; height: 36px; border: 4px solid #dbe4f0; border-top-color: #0b5ed7; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadRetry { display: none; }
  #envWarn { display: none; background: #fff3cd; color: #7a5b00; border: 1px solid #ffe69c; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  #envWarn b { color: #b02a37; }
  #modalMask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 200; padding: 18px; }
  #modalMask.show { display: flex; }
  #modal { background: #fff; border-radius: 14px; max-width: 420px; width: 100%; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #modal h3 { margin: 0 0 10px; font-size: 16px; color: #b02a37; }
  #modal .mbody { font-size: 14px; line-height: 1.7; color: #333; white-space: pre-wrap; word-break: break-word; }
  #modal .mbody code { background: #f0f4fa; padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
  #modal .mfoot { text-align: right; margin-top: 16px; }

  #colPickerMask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 300; padding: 18px;
  }
  #colPickerMask.show { display: flex; }
  #colPicker {
    background: #fff; border-radius: 14px; max-width: 480px; width: 100%;
    padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
    max-height: 82vh; display: flex; flex-direction: column;
  }
  #colPicker h3 { margin: 0 0 6px; font-size: 16px; color: #0b5ed7; }
  .colPickerHint { font-size: 12px; color: #666; margin-bottom: 12px; }
  #colPickerList { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .colPickBtn {
    display: block; width: 100%; text-align: left;
    padding: 12px 14px; margin-bottom: 8px;
    border: 2px solid #e3e7ee; border-radius: 10px;
    background: #f8fafc; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #1a1a2e; font-family: inherit;
  }
  .colPickBtn:active { background: #e0ecff; border-color: #0b5ed7; }
  .colPickBtn.current { border-color: #0b5ed7; background: #e0ecff; }
  .colPickBtn .idx { color: #0b5ed7; margin-right: 8px; font-size: 12px; font-weight: 700; }
</style>
</head>

<script>
/* ===== 多 CDN 容错加载 ===== */
var LIBS = {
  XLSX: [
    "https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    "https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js",
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
    "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"
  ],
  ExcelJS: [
    "https://cdn.bootcdn.net/ajax/libs/exceljs/4.4.0/exceljs.min.js",
    "https://cdn.staticfile.org/exceljs/4.4.0/exceljs.min.js",
    "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js",
    "https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js"
  ],
  Html5Qrcode: [
    "https://cdn.bootcdn.net/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js",
    "https://cdn.staticfile.org/html5-qrcode/2.3.8/html5-qrcode.min.js",
    "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js",
    "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ]
};
function loadOne(urls, i, ok, fail){
  if(i >= urls.length){ fail(); return; }
  var s = document.createElement("script");
  s.src = urls[i];
  s.async = true;
  s.onload = ok;
  s.onerror = function(){ loadOne(urls, i+1, ok, fail); };
  document.head.appendChild(s);
}
loadOne(LIBS.XLSX, 0, function(){
  document.getElementById("loadStatus").style.display = "none";
  document.getElementById("btnUpload").disabled = false;
  loadOne(LIBS.ExcelJS, 0, function(){}, function(){});
  loadOne(LIBS.Html5Qrcode, 0, function(){}, function(){});
}, function(){
  document.getElementById("loadText").textContent = "表格组件加载失败，请检查网络后重试";
  document.getElementById("loadText").style.color = "#dc3545";
  document.getElementById("loadRetry").style.display = "inline-block";
  document.querySelector(".spinner").style.display = "none";
});
</script>

<script>
let sheetName = "", headers = [], rows = [];
let matchColIdx = -1, matchedSet = new Set(), codeIndex = new Map();
let fileBase = "核对结果";
let lastHitRow = -1;
let hasSavedData = false;
let checkLog = [];
const $ = id => document.getElementById(id);

function showDataButtons(show) {
  document.querySelectorAll(".need-data").forEach(el => {
    el.style.display = show ? "" : "none";
  });
}

/* =========================================================
   IndexedDB
   ========================================================= */
const DB_NAME = 'philips_check_db';
const DB_VERSION = 1;
const DB_STORE = 'table_data';
const KEY_MATCHED = 'philips_check_matched_v1';

let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB 不可用")); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
function dbPut(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  })).catch(e => { console.warn("dbPut失败", key, e); return false; });
}
function dbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
    req.onerror = () => reject(req.error);
  })).catch(e => { console.warn("dbGet失败", key, e); return null; });
}
function dbDelete(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  })).catch(e => false);
}

function saveTableData(data) { return dbPut('main', data); }
function loadTableData() { return dbGet('main'); }
function deleteTableData() { return dbDelete('main'); }
function saveLogToDB() { return dbPut('log', checkLog.slice(-5000)); }
function loadLogFromDB() { return dbGet('log').then(v => Array.isArray(v) ? v : []); }
function deleteLogFromDB() { return dbDelete('log'); }

function saveMatched() {
  try { localStorage.setItem(KEY_MATCHED, JSON.stringify(Array.from(matchedSet))); } catch(e) {}
}
function loadMatched() {
  try { const s = localStorage.getItem(KEY_MATCHED); return s ? JSON.parse(s) : []; } catch(e) { return []; }
}
function clearMatched() {
  try { localStorage.removeItem(KEY_MATCHED); } catch(e) {}
}

/* =========================================================
   振动反馈
   ========================================================= */
function vibrate(type) {
  if (!navigator.vibrate) return;
  try {
    if (type === 'ok') {
      navigator.vibrate(60);
    } else if (type === 'dup') {
      navigator.vibrate([80, 60, 80]);
    } else if (type === 'miss') {
      navigator.vibrate([300, 100, 300, 100, 300]);
    }
  } catch(e) {}
}

/* =========================================================
   音频 —— 【本次改动】音量全部拉满到 1.0（最大值）
   成功/重复/失败/解锁全部 gain=1.0
   ========================================================= */
let audioCtx = null;
function ensureCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  return audioCtx;
}
function playTone(ctx, freq, durationMs, volume, startTime) {
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    // 音量上限 1.0，超过会削波失真，所以直接封顶
    const v = Math.min(volume, 1.0);
    g.gain.setValueAtTime(v, startTime);
    g.gain.exponentialRampToValueAtTime(0.001, startTime + durationMs / 1000);
    o.start(startTime);
    o.stop(startTime + durationMs / 1000);
  } catch(e) {}
}
function initAudioAndUnlock() {
  const ctx = ensureCtx();
  if (!ctx) return;
  const fire = () => { playTone(ctx, 1500, 130, 1.0, ctx.currentTime); };  // 1.0 满音量
  if (ctx.state === 'suspended') { ctx.resume().then(fire).catch(fire); }
  else { fire(); }
}
function playBeep(type) {
  const ctx = ensureCtx();
  if (!ctx) return;
  const fire = () => {
    const now = ctx.currentTime;
    if (type === 'ok') {
      playTone(ctx, 1500, 120, 1.0, now);          // 满音量
      playTone(ctx, 2000, 130, 1.0, now + 0.14);   // 满音量
    } else if (type === 'dup') {
      playTone(ctx, 1000, 60, 1.0, now);           // 满音量
      playTone(ctx, 1000, 60, 1.0, now + 0.1);     // 满音量
      playTone(ctx, 1000, 60, 1.0, now + 0.2);     // 满音量
    } else if (type === 'miss') {
      playTone(ctx, 400, 500, 1.0, now);           // 满音量
    }
  };
  if (ctx.state === 'suspended') { ctx.resume().then(fire).catch(fire); }
  else { fire(); }
}
function speak(text){
  try{
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 1.15; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===== UI ===== */
function toast(head, info, ms){
  const t = $("toast");
  let html = '<div class="head">' + head + '</div>';
  if (info) html += '<span class="info">' + info + '</span>';
  t.innerHTML = html;
  t.style.display = "block";
  clearTimeout(t._tm);
  t._tm = setTimeout(()=> t.style.display = "none", ms || 2600);
}
function logMsg(cls, msg){
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = msg;
  $("log").prepend(d);
  $("logCard").style.display = "block";
}
function popup(title, bodyHtml){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = bodyHtml;
  $("modalMask").classList.add("show");
}
$("modalOk").onclick = () => $("modalMask").classList.remove("show");
$("modalMask").onclick = e => { if(e.target === $("modalMask")) $("modalMask").classList.remove("show"); };

function hasGetUserMedia(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ===== 列选择 ===== */
function pickColumn(currentIdx, callback) {
  const mask = $("colPickerMask");
  const list = $("colPickerList");
  list.innerHTML = "";
  headers.forEach((h, i) => {
    const btn = document.createElement("button");
    btn.className = "colPickBtn" + (i === currentIdx ? " current" : "");
    btn.innerHTML = '<span class="idx">第' + (i + 1) + '列</span>' + esc(h || "(空标题)");
    btn.onclick = () => {
      mask.classList.remove("show");
      callback(i);
    };
    list.appendChild(btn);
  });
  mask.classList.add("show");
}

/* ===== 上传 ===== */
$("btnUpload").onclick = () => {
  if (hasSavedData) {
    if (!confirm("检测到上次保存的核对数据。\n\n上传新表格会覆盖旧数据，是否继续？\n\n（如果想保留旧数据，点取消）")) return;
  }
  pickFile();
};

function pickFile() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xls,.csv";
  inp.onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    $("fileName").textContent = f.name;
    fileBase = f.name.replace(/\.[^.]+$/, "");
    $("uploadBusy").style.display = "inline";
    $("btnUpload").disabled = true;

    try {
      if (typeof XLSX === "undefined") throw new Error("XLSX 组件未加载，请检查网络后重试");

      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
      if (!arr.length) { toast("提示", "表格为空"); return; }

      headers = arr[0].map(h => String(h).trim());
      rows = arr.slice(1).filter(r => r.some(c => String(c).trim() !== ""));
      if (!headers.length) { toast("提示", "表格没有表头"); return; }

      $("uploadBusy").style.display = "none";
      $("btnUpload").disabled = false;

      pickColumn(-1, function(idx) {
        matchColIdx = idx;

        $("colBadge").style.display = "inline";
        $("colBadge").textContent = "核对列：" + (headers[idx] || "第" + (idx + 1) + "列");

        matchedSet = new Set();
        lastHitRow = -1;
        clearMatched();
        buildIndex();
        renderTable(); updateStats();

        $("restoreBanner").style.display = "none";
        showDataButtons(true);
        $("statCard").style.display = "block";
        $("tableCard").style.display = "block";
        $("btnCamera").style.display = "";
        $("btnStop").style.display = "none";

        toast("已读取 " + rows.length + " 行数据", "正在后台保存进度…");

        saveTableData({
          headers: headers, rows: rows, matchColIdx: matchColIdx,
          sheetName: sheetName, fileBase: fileBase, savedAt: Date.now()
        }).then(ok => {
          hasSavedData = ok;
          if (ok) toast("核对列：" + (headers[idx] || ""), "✅ 进度已保存，可放心关闭");
          else    toast("核对列：" + (headers[idx] || ""), "⚠️ 进度保存失败，请勿关闭页面");
        });
      });

    } catch (err) {
      console.error(err);
      toast("读取失败", String(err && err.message || err));
      $("uploadBusy").style.display = "none";
      $("btnUpload").disabled = false;
    }
  };
  inp.click();
}

/* 更换核对列 */
$("btnChangeCol").onclick = () => {
  if (!headers.length) return;
  if (!confirm("更换核对列会清空当前核对进度，是否继续？")) return;
  pickColumn(matchColIdx, function(idx) {
    matchColIdx = idx;
    $("colBadge").style.display = "inline";
    $("colBadge").textContent = "核对列：" + (headers[idx] || "第" + (idx + 1) + "列");

    matchedSet = new Set();
    lastHitRow = -1;
    clearMatched();
    buildIndex();
    renderTable(); updateStats();

    saveTableData({
      headers: headers, rows: rows, matchColIdx: matchColIdx,
      sheetName: sheetName, fileBase: fileBase, savedAt: Date.now()
    });
    toast("已切换核对列", headers[idx] || "");
  });
};

function buildIndex(){
  codeIndex = new Map();
  rows.forEach((r, i) => {
    const k = String(r[matchColIdx] ?? "").trim();
    if(!k) return;
    if(!codeIndex.has(k)) codeIndex.set(k, []);
    codeIndex.get(k).push(i);
  });
}
function renderTable(){
  let html = "<tr>" + headers.map(h=>"<th>"+esc(h)+"</th>").join("") + "</tr>";
  rows.forEach((r,i)=>{
    html += "<tr data-i='"+i+"' class='"+(matchedSet.has(i)?"matched":"")+"'>"
          + headers.map((_,j)=>"<td>"+esc(String(r[j]??""))+"</td>").join("") + "</tr>";
  });
  $("grid").innerHTML = html;
}
function updateStats(){
  $("statCard").style.display = "block";
  $("stTotal").textContent = rows.length;
  $("stDone").textContent = matchedSet.size;
  $("stLeft").textContent = rows.length - matchedSet.size;
}
function getRowInfo(rowIndex) {
  const rowData = rows[rowIndex] || [];
  const parts = [];
  rowData.forEach((val, idx) => {
    const s = String(val).trim();
    if (s) {
      const h = headers[idx] ? headers[idx] : ("列" + (idx + 1));
      parts.push(h + "：" + s);
    }
  });
  return parts.join(" | ");
}

/* ===== 定位 ===== */
$("btnLocate").onclick = () => {
  if (lastHitRow < 0) { toast("提示", "还没有成功核对任何项目"); return; }
  const wrap = document.querySelector(".table-wrap");
  const tr = document.querySelector("tr[data-i='"+lastHitRow+"']");
  if (wrap && tr) {
    wrap.scrollTop = tr.offsetTop - wrap.clientHeight / 2 + tr.clientHeight / 2;
    toast("已定位", "已滚动到最新核对行");
  }
};

/* ===== 核对逻辑 ===== */
function addLog(code, result, info) {
  const d = new Date();
  const timeStr = d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,'0') + "-" +
    String(d.getDate()).padStart(2,'0') + " " +
    String(d.getHours()).padStart(2,'0') + ":" +
    String(d.getMinutes()).padStart(2,'0') + ":" +
    String(d.getSeconds()).padStart(2,'0');
  checkLog.push({ time: timeStr, code: code, result: result, info: info || "" });
  saveLogToDB();
}

function check(code){
  code = String(code||"").trim(); if(!code) return;
  const list = codeIndex.get(code);
  let hit = -1, dup = false;
  if(list){
    for(const i of list){ if(!matchedSet.has(i)){ hit = i; break; } }
    if(hit < 0) dup = true;
  }
  const ts = new Date().toLocaleTimeString();
  if(hit >= 0){
    matchedSet.add(hit);
    lastHitRow = hit;
    logMsg("ok", ts + " ✅ 匹配成功：" + code);
    renderTable(); updateStats();
    saveMatched();
    const info = getRowInfo(hit);
    addLog(code, "成功", info);
    playBeep('ok');
    vibrate('ok');
    speak("可以配送");
    toast("✅ 已核对 · 可以配送", info);
  } else if(dup){
    logMsg("dup", ts + " ⚠️ 重复扫描：" + code);
    addLog(code, "重复", "该条码已核对过");
    playBeep('dup');
    vibrate('dup');
    speak("重复扫描");
    toast("⚠️ 重复扫描", "该条码已核对过：" + code);
  } else {
    logMsg("miss", ts + " ❌ 未在表格中找到：" + code);
    addLog(code, "失败", "未在表格中找到");
    playBeep('miss');
    vibrate('miss');
    speak("不可配送，需滞留");
    toast("❌ 不可配送，需滞留", "未在表格中找到：" + code);
  }
  if(matchedSet.size === rows.length && rows.length) speak("核对完成");
}

/* ===== 扫码 ===== */
let camStream = null, camTrack = null, camVideo = null;
let nativeDetector = null, scanning = false, starting = false;
let scanTimer = null, loopBusy = false;
let scanner = null, fallbackMode = false;
let lastCode = "", lastCodeTime = 0;

function emitCode(code){
  code = String(code||"").trim();
  if(!code) return;
  const now = Date.now();
  if(code === lastCode && now - lastCodeTime < 2000) return;
  lastCode = code; lastCodeTime = now;
  check(code);
}

const WANTED_FORMATS = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code"];

async function makeDetector(){
  if(!("BarcodeDetector" in window)) return null;
  try{
    const sup = await BarcodeDetector.getSupportedFormats();
    const formats = WANTED_FORMATS.filter(f => sup.includes(f));
    if(formats.length) return new BarcodeDetector({ formats });
  }catch(e){}
  return null;
}
async function tuneTrack(track){
  if(!track) return;
  const caps = (track.getCapabilities ? track.getCapabilities() : {}) || {};
  const adv = [];
  if(Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")) adv.push({ focusMode: "continuous" });
  if(Array.isArray(caps.exposureMode) && caps.exposureMode.includes("continuous")) adv.push({ exposureMode: "continuous" });
  if(adv.length){ try{ await track.applyConstraints({ advanced: adv }); }catch(e){} }
  try{ await track.applyConstraints({ width: { ideal: 3840 }, height: { ideal: 2160 } }); }catch(e){}
}
async function startNativeScan(){
  const det = await makeDetector();
  if(!det) throw new Error("no-native-detector");

  const container = $("reader");
  container.innerHTML = "";

  const video = document.createElement("video");
  video.setAttribute("playsinline", "");
  video.setAttribute("muted", "");
  video.autoplay = true;
  video.muted = true;
  container.appendChild(video);

  const overlay = document.createElement("div");
  overlay.className = "scan-frame";
  container.appendChild(overlay);

  let stream = null, lastErr = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 30 } }
    });
  } catch(e) {
    lastErr = e;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
    } catch(e2) { lastErr = e2; }
  }
  if(!stream) throw lastErr || new Error("无法打开摄像头");

  video.srcObject = stream;
  camStream = stream;
  camTrack = stream.getVideoTracks()[0];
  await video.play();
  await tuneTrack(camTrack);

  video.addEventListener("click", async ev => {
    if(!camTrack || !camTrack.getCapabilities) return;
    const caps = camTrack.getCapabilities();
    if(!caps.pointsOfInterest) return;
    const rect = video.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width;
    const y = (ev.clientY - rect.top) / rect.height;
    try{
      await camTrack.applyConstraints({ advanced: [{ pointsOfInterest: [{ x, y }] }, { focusMode: "single-shot" }] });
      setTimeout(()=>{ try{ camTrack.applyConstraints({ advanced:[{ focusMode:"continuous" }] }); }catch(e){} }, 2000);
    }catch(e){}
  });

  nativeDetector = det;
  camVideo = video;
  scanning = true;
  scanLoop();
  return true;
}
async function scanLoop(){
  if(!scanning || !nativeDetector || !camVideo) return;
  if(!loopBusy && camVideo.readyState >= 2 && camVideo.videoWidth > 0){
    loopBusy = true;
    try{
      const codes = await nativeDetector.detect(camVideo);
      if(codes && codes.length){
        for(const c of codes){ if(c.rawValue) emitCode(c.rawValue); }
      }
    }catch(e){}
    loopBusy = false;
  }
  scanTimer = setTimeout(scanLoop, 80);
}
async function startFallbackScan(){
  if(typeof Html5Qrcode === "undefined") throw new Error("扫码库未加载");
  fallbackMode = true;
  const el = $("reader");
  el.innerHTML = "";
  scanner = new Html5Qrcode("reader", false);
  await scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: { width: 280, height: 160 }, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
    code => emitCode(code),
    () => {}
  );
  await boostStreamResolution();
  scanning = true;
}
async function boostStreamResolution(){
  const v = $("reader").querySelector("video");
  if(!v || !v.srcObject) return;
  const t = v.srcObject.getVideoTracks()[0];
  if(!t) return;
  try{ await t.applyConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] }); }catch(e){}
}
function stopCamStream(){
  if(camStream){ try{ camStream.getTracks().forEach(t => t.stop()); }catch(e){} }
  camStream = null; camTrack = null; camVideo = null; nativeDetector = null;
}
async function stopScan(){
  scanning = false;
  if(scanTimer){ clearTimeout(scanTimer); scanTimer = null; }
  if(fallbackMode && scanner){
    try{ await scanner.stop(); }catch(e){}
    try{ scanner.clear(); }catch(e){}
    scanner = null; fallbackMode = false;
  }
  stopCamStream();
  const el = $("reader");
  el.innerHTML = "";
  $("readerWrap").style.display = "none";
  $("btnCamera").style.display = "";
  $("btnStop").style.display = "none";
}
function cameraErrText(e){
  const name = (e && e.name) || "";
  const raw  = (e && e.message) ? e.message : String(e || "");
  switch(name){
    case "NotAllowedError": return "摄像头权限被拒绝。\n\n请点击浏览器地址栏左侧的 🔒 图标，把摄像头改为「允许」，刷新重试。";
    case "NotFoundError": return "没有检测到摄像头设备。";
    case "NotReadableError": return "摄像头被占用。请关闭其他使用相机的程序后重试。";
    case "OverconstrainedError": return "手机不支持这么高的分辨率。";
    default: return "错误类型：" + (name || "未知") + "\n" + raw;
  }
}

$("btnCamera").onclick = async () => {
  if(scanning || starting) return;
  initAudioAndUnlock();
  if(!hasGetUserMedia()){
    popup("不支持摄像头", "请使用 Chrome 或系统自带浏览器打开，不要用微信内置浏览器。");
    return;
  }
  starting = true;
  $("btnCamera").disabled = true;
  $("readerWrap").style.display = "block";

  try{
    let ok = false;
    if("BarcodeDetector" in window){
      try{ ok = await startNativeScan(); }
      catch(e){
        console.warn("原生扫码不可用，回退降级方案：", e);
        stopCamStream();
        $("reader").innerHTML = "";
      }
    }
    if(!ok){ await startFallbackScan(); }
    scanning = true;
    $("btnCamera").style.display = "none";
    $("btnStop").style.display = "";
  }catch(e){
    await stopScan();
    popup("无法开启相机", cameraErrText(e));
  }finally{
    starting = false;
    $("btnCamera").disabled = false;
  }
};
$("btnStop").onclick = () => { stopScan(); };

/* =========================================================
   导出工具
   ========================================================= */
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
}
async function buildAndShareExcel(rowIdxList, outBaseName) {
  if (typeof ExcelJS === "undefined") { toast("导出组件未加载完成", "请稍后再试"); return; }
  if (!rowIdxList.length) { toast("提示", "没有可导出的数据"); return; }
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet(sheetName || "核对结果");
    ws.addRow(headers).font = { bold: true };
    rowIdxList.forEach(i => {
      const r = rows[i] || [];
      const row = ws.addRow(headers.map((_, j) => r[j] ?? ""));
      if (matchedSet.has(i)) {
        row.eachCell(cell => {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFFC7CE" } };
          cell.font = { color: { argb: "FF9C0006" }, bold: true };
        });
      }
    });
    headers.forEach((h, j) => { ws.getColumn(j + 1).width = Math.max(12, String(h).length * 2 + 6); });

    const buf = await wb.xlsx.writeBuffer();
    const outName = outBaseName + ".xlsx";
    $("exportName").textContent = "已生成：" + outName;

    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const file = new File([blob], outName, { type: blob.type });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: outBaseName }); return; }
      catch(e){ if(e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = outName;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("已下载", outName);
  } catch (err) { toast("导出失败", err.message); }
}

$("btnExport").onclick = () => {
  if (!rows.length) return;
  buildAndShareExcel(rows.map((_, i) => i), getTodayStr());
};
$("btnExportMatched").onclick = () => {
  if (!rows.length) return;
  if (matchedSet.size === 0) { toast("提示", "还没有已核对的行可导出"); return; }
  const idxList = Array.from(matchedSet).sort((a, b) => a - b);
  buildAndShareExcel(idxList, getTodayStr() + "已配送的明细");
};
$("btnExportLog").onclick = async () => {
  if (typeof ExcelJS === "undefined") { toast("导出组件未加载完成", "请稍后再试"); return; }
  if (!checkLog.length) { toast("提示", "还没有运行日志可导出"); return; }
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet("核对日志");
    const headerRow = ws.addRow(["序号", "时间", "条码", "核对结果", "详细信息"]);
    headerRow.font = { bold: true };
    checkLog.forEach((item, idx) => {
      const row = ws.addRow([idx + 1, item.time, item.code, item.result, item.info || ""]);
      if (item.result === "成功") row.getCell(4).font = { color: { argb: "FF198754" }, bold: true };
      else if (item.result === "失败") row.getCell(4).font = { color: { argb: "FFDC3545" }, bold: true };
      else if (item.result === "重复") row.getCell(4).font = { color: { argb: "FFFD7E14" }, bold: true };
    });
    ws.getColumn(1).width = 8; ws.getColumn(2).width = 22; ws.getColumn(3).width = 25; ws.getColumn(4).width = 12; ws.getColumn(5).width = 60;

    const buf = await wb.xlsx.writeBuffer();
    const outName = getTodayStr() + "核对日志.xlsx";
    $("exportName").textContent = "已生成：" + outName;
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const file = new File([blob], outName, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "核对日志" }); return; }
      catch(e){ if(e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = outName; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast("已下载", outName);
  } catch (err) { toast("导出失败", err.message); }
};

/* =========================================================
   清除保存的数据
   ========================================================= */
$("btnClearStorage").onclick = function() {
  if (!confirm("确定要清除已保存的表格、核对进度和运行日志吗？此操作不可恢复。")) return;

  hasSavedData = false;
  headers = []; rows = []; matchColIdx = -1;
  matchedSet = new Set(); codeIndex = new Map();
  checkLog = [];
  lastHitRow = -1; fileBase = "核对结果";

  $("restoreBanner").style.display = "none";
  $("fileName").textContent = "";
  $("colBadge").style.display = "none";
  showDataButtons(false);
  $("statCard").style.display = "none";
  $("tableCard").style.display = "none";
  $("logCard").style.display = "none";
  $("readerWrap").style.display = "none";
  $("grid").innerHTML = "";
  $("log").innerHTML = "";
  $("btnCamera").style.display = "none";
  $("btnStop").style.display = "none";
  $("btnUpload").disabled = false;

  try { deleteTableData(); } catch(e) {}
  try { deleteLogFromDB(); } catch(e) {}
  clearMatched();

  toast("已清除", "保存的数据已删除");
};

/* =========================================================
   页面加载后恢复
   ========================================================= */
async function tryRestore() {
  try {
    checkLog = await loadLogFromDB();

    const data = await loadTableData();
    if (!data || !data.rows || !data.rows.length) {
      hasSavedData = false;
      return;
    }

    hasSavedData = true;

    headers = data.headers || [];
    rows = data.rows || [];
    matchColIdx = data.matchColIdx;
    sheetName = data.sheetName || "核对结果";
    fileBase = data.fileBase || "核对结果";

    if (matchColIdx < 0 || matchColIdx >= headers.length) {
      pickColumn(-1, function(idx) {
        matchColIdx = idx;
        $("colBadge").style.display = "inline";
        $("colBadge").textContent = "核对列：" + (headers[idx] || "");
        matchedSet = new Set();
        buildIndex();
        renderTable(); updateStats();
        showDataButtons(true);
        $("statCard").style.display = "block";
        $("tableCard").style.display = "block";
        saveTableData({
          headers: headers, rows: rows, matchColIdx: idx,
          sheetName: sheetName, fileBase: fileBase, savedAt: Date.now()
        });
        toast("已读取 " + rows.length + " 行数据", "");
      });
      return;
    }

    const matchedArr = loadMatched();
    matchedSet = new Set(matchedArr);
    lastHitRow = matchedArr.length ? Math.max.apply(null, matchedArr) : -1;

    $("fileName").textContent = "（已恢复）" + fileBase + ".xlsx";
    $("colBadge").style.display = "inline";
    $("colBadge").textContent = "核对列：" + headers[matchColIdx];

    buildIndex();
    renderTable();
    updateStats();

    showDataButtons(true);
    $("statCard").style.display = "block";
    $("tableCard").style.display = "block";
    $("logCard").style.display = checkLog.length ? "block" : "none";

    $("restoreText").innerHTML = "💾 已恢复上次核对进度（" + matchedSet.size + "/" + rows.length + " 已核对，日志 " + checkLog.length + " 条）";
    $("restoreBanner").style.display = "flex";
  } catch(e) {
    console.warn("恢复数据失败", e);
    hasSavedData = false;
  }
}

setTimeout(tryRestore, 300);
</script>
