<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞利浦送货</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --glass-bg:rgba(255,255,255,.55);
  --glass-bg-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.75);
  --glass-shadow:0 8px 32px rgba(31,38,135,.16), inset 0 1px 0 rgba(255,255,255,.85);
  --glass-shadow-sm:0 4px 16px rgba(31,38,135,.12), inset 0 1px 0 rgba(255,255,255,.7);
  --ink:#1c1c1e;
  --ink-2:#3a3a3c;
  --ink-3:#6c6c70;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.14);
  --ok:#34c759;
  --warn:#ff9f0a;
  --bad:#ff3b30;
  --radius-xl:26px;
  --radius-lg:20px;
  --radius-md:16px;
}
body{
  font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  margin:0;color:var(--ink);
  background:
    radial-gradient(1200px 800px at 12% -5%, #cfe4ff 0%, rgba(207,228,255,0) 55%),
    radial-gradient(1000px 700px at 95% 8%, #ffe3ef 0%, rgba(255,227,239,0) 52%),
    radial-gradient(900px 900px at 50% 108%, #d9f4ff 0%, rgba(217,244,255,0) 58%),
    linear-gradient(180deg,#eef3fb 0%,#e9eef7 45%,#eef2f8 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* 背景柔光斑，制造水波纹通透感 */
body::before{
  content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;pointer-events:none;z-index:0;
  background:
    radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0) 70%) 18% 30%/420px 420px no-repeat,
    radial-gradient(closest-side,rgba(200,225,255,.75),rgba(200,225,255,0) 70%) 78% 20%/520px 520px no-repeat,
    radial-gradient(closest-side,rgba(255,215,235,.6),rgba(255,215,235,0) 70%) 60% 75%/460px 460px no-repeat;
  filter:blur(2px);
}
header,main,.toast,#loadStatus,#modalMask,#colPickerMask,#voiceMask,#fuzzyMask{position:relative;z-index:1}

/* ===== 顶部栏：液态玻璃 ===== */
header{
  margin:12px 12px 0;
  padding:14px 18px;
  display:flex;align-items:center;gap:10px;
  border-radius:var(--radius-lg);
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.52));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px;font-weight:650}
.badge{
  background:rgba(10,132,255,.12);
  color:var(--accent);
  border:1px solid rgba(10,132,255,.22);
  border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
main{max-width:960px;margin:0 auto;padding:14px 12px 28px}

/* ===== 卡片：玻璃体 ===== */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.44));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
}

/* ===== 按钮：统一玻璃态，不再五颜六色 ===== */
.btn{
  position:relative;overflow:hidden;
  display:inline-block;
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:12px 18px;
  font-size:15px;font-weight:600;font-family:inherit;
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.58));
  box-shadow:var(--glass-shadow-sm);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  backdrop-filter:blur(18px) saturate(170%);
  cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease, background .22s ease, opacity .2s ease;
  user-select:none;
}
/* 水波纹高光 */
.btn::after{
  content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);
  transform:translate(-50%,-50%);opacity:0;transition:width .5s ease,height .5s ease,opacity .6s ease;
  pointer-events:none;
}
.btn:active{transform:scale(.965);box-shadow:0 2px 10px rgba(31,38,135,.14), inset 0 1px 0 rgba(255,255,255,.8)}
.btn:active::after{width:240%;height:240%;opacity:.85;transition:width .45s ease,height .45s ease,opacity .1s ease}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:var(--glass-shadow-sm)}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:12px}

/* 所有旧配色类统一成玻璃态（强调用极淡的色晕区分层级，而不是大块彩色） */
.btn-primary,.btn-success,.btn-danger,.btn-secondary,.btn-warning,.btn-info,.btn-dark{
  color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.58));
  border-color:var(--glass-border);
}
/* 只给“扫描/主操作”一点淡蓝晕，保持克制 */
.btn-primary,.btn-success{
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(214,232,255,.66));
  border-color:rgba(255,255,255,.9);
  color:#0a4fa8;
}
.btn-danger{color:#a3231b;background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,224,222,.6));border-color:rgba(255,255,255,.88)}
.btn-warning{color:#8a5400;background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,236,204,.6));border-color:rgba(255,255,255,.88)}

.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-grid .btn{margin:0;width:100%;padding:15px 8px;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;border-radius:var(--radius-md)}
.btn-grid .btn.span-2{grid-column:1/-1}

/* ===== 恢复提示条 ===== */
#restoreBanner{
  display:none;align-items:center;gap:8px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(226,255,236,.6));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px;color:#0d5c34;
  box-shadow:var(--glass-shadow-sm);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
}
#restoreBanner .spacer{flex:1}

/* ===== 统计 ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.48));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:12px 10px;text-align:center;
  box-shadow:var(--glass-shadow-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:.5px}
.stat[style*="198754"]{color:var(--ok)!important}
.stat[style*="dc3545"]{color:var(--bad)!important}

/* ===== 摄像头区域（保留原有结构，仅外框玻璃化） ===== */
#readerWrap{display:none;margin-bottom:14px}
#reader{
  position:relative;width:100%;max-width:480px;margin:0 auto;
  border-radius:var(--radius-xl);overflow:hidden;background:#000;
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
#reader video{width:100%;display:block;background:#000;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82%;height:40%;border:2px solid rgba(255,80,80,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.2);pointer-events:none;z-index:10}
.scan-frame::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,80,80,.85);animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:8%}50%{top:92%}}
.focus-ring{position:absolute;width:80px;height:80px;margin-left:-40px;margin-top:-40px;border:2px solid #fff;border-radius:12px;pointer-events:none;z-index:20;display:none;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 14px rgba(255,255,255,.5)}
.focus-ring.active{display:block;animation:focusPulse .9s ease-out}
@keyframes focusPulse{0%{transform:scale(1.5);opacity:0}35%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
#camStatus{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,.55);color:#fff;padding:4px 12px;border-radius:14px;font-size:11px;white-space:nowrap;z-index:15;max-width:92%;overflow:hidden;text-overflow:ellipsis;display:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#controlPanel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:90%;max-width:440px;z-index:30;display:none;flex-direction:column;gap:8px;background:rgba(255,255,255,.22);padding:12px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.control-row{display:flex;align-items:center;gap:10px}
.control-row span{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;min-width:32px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.control-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.38);outline:none}
.control-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#focusStepBtnGroup{display:none;gap:8px;align-items:center}
#focusStepBtnGroup button{flex:1;padding:7px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:10px;background:rgba(255,255,255,.35);color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#focusStepBtnGroup button:active{background:rgba(255,255,255,.55)}

/* ===== 日志 ===== */
#logCard{display:none}
.log{max-height:180px;overflow-y:auto;font-size:13px}
.log .ok{color:var(--ok)}
.log .dup{color:var(--warn)}
.log .miss{color:var(--bad)}

/* ===== 表格：保持清晰，仅做轻玻璃包裹（不改配色逻辑） ===== */
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
th,td{border:1px solid #e3e7ee;padding:7px 8px;text-align:left;white-space:nowrap}
th{background:#eef2f8;position:sticky;top:0;z-index:1}
td.matched{background:#ffe3e3 !important;color:#b02a37;font-weight:700}
.table-wrap{
  max-height:50vh;overflow:auto;border-radius:14px;
  -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.9);
}
.hint{color:var(--ink-3);font-size:13px;line-height:1.6}
#fileName{font-size:13px;color:var(--accent);margin-left:6px;word-break:break-all}
#uploadBusy{display:none;margin-left:8px;font-size:13px;color:var(--accent)}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.62));
  color:var(--ink);
  padding:14px 22px;border-radius:22px;font-size:15px;display:none;z-index:99;
  max-width:90vw;text-align:center;line-height:1.6;word-break:break-word;
  border:1px solid var(--glass-border);
  box-shadow:0 12px 40px rgba(31,38,135,.22), inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
}
.toast .head{font-size:16px;font-weight:700}
.toast .info{display:block;font-size:13px;font-weight:500;color:#8a5a00;margin-top:6px}

/* ===== 加载层 ===== */
#loadStatus{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  z-index:100;font-size:15px;color:var(--ink-2);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.55));
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
}
.spinner{width:38px;height:38px;border:4px solid rgba(10,132,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadRetry{display:none}

/* ===== 弹层：统一玻璃 ===== */
#modalMask{position:fixed;inset:0;background:rgba(20,24,38,.28);display:none;align-items:center;justify-content:center;z-index:200;padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#modalMask.show{display:flex}
#modal{
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(255,255,255,.7));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);max-width:420px;width:100%;padding:22px;
  box-shadow:0 20px 60px rgba(31,38,135,.28), inset 0 1px 0 rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
}
#modal h3{margin:0 0 10px;font-size:17px;color:var(--bad)}
#modal .mbody{font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
#modal .mfoot{text-align:right;margin-top:16px}

#colPickerMask{position:fixed;inset:0;background:rgba(20,24,38,.28);display:none;align-items:center;justify-content:center;z-index:300;padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#colPickerMask.show{display:flex}
#colPicker{
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.72));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);max-width:480px;width:100%;padding:22px;
  box-shadow:0 20px 60px rgba(31,38,135,.28), inset 0 1px 0 rgba(255,255,255,.95);
  max-height:82vh;display:flex;flex-direction:column;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
}
#colPicker h3{margin:0 0 6px;font-size:17px;color:var(--accent)}
.colPickerHint{font-size:12px;color:var(--ink-3);margin-bottom:12px}
#colPickerList{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.colPickBtn{
  display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;
  border:1px solid var(--glass-border);border-radius:var(--radius-md);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.55));
  font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;
  box-shadow:var(--glass-shadow-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .18s ease,background .2s ease;
}
.colPickBtn:active{transform:scale(.98);background:rgba(255,255,255,.85)}
.colPickBtn.current{border-color:rgba(10,132,255,.5);background:linear-gradient(180deg,rgba(230,242,255,.9),rgba(214,232,255,.7))}
.colPickBtn .idx{color:var(--accent);margin-right:8px;font-size:12px;font-weight:700}
.colPickBtn.allBtn{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,244,225,.6))}
.colPickBtn.allBtn.current{border-color:rgba(255,159,10,.5);background:linear-gradient(180deg,rgba(255,246,232,.95),rgba(255,232,200,.75))}
.colPickBtn.allBtn .idx{color:var(--warn)}

#voiceMask{position:fixed;inset:0;background:rgba(20,24,38,.3);display:none;align-items:center;justify-content:center;z-index:400;padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#voiceMask.show{display:flex}
#voicePanel{
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.72));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);max-width:440px;width:100%;padding:22px;
  box-shadow:0 20px 60px rgba(31,38,135,.3), inset 0 1px 0 rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
}
#voicePanel h3{margin:0 0 8px;font-size:17px;color:var(--accent)}
.voiceHint{font-size:12px;color:var(--ink-3);line-height:1.7;margin-bottom:12px}
#voiceStatus{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:10px;text-align:center;padding:9px;background:rgba(10,132,255,.08);border-radius:12px;border:1px solid rgba(10,132,255,.15)}
.voiceBlock{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));
  border:1px solid var(--glass-border);
  border-radius:14px;padding:11px 13px;margin-bottom:8px;min-height:46px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.voiceBlock .label{font-size:11px;color:var(--ink-3);display:block;margin-bottom:4px;font-weight:600}
.voiceBlock .content{font-size:14px;color:var(--ink-2);word-break:break-all;line-height:1.5}
.voiceBlock.norm{background:linear-gradient(180deg,rgba(240,255,245,.85),rgba(220,250,232,.6));border-color:rgba(52,199,89,.25)}
.voiceBlock.norm .content{font-size:17px;color:#1f8a3b;font-weight:800;letter-spacing:1px}
.voiceActions{display:flex;gap:8px;margin-top:14px}
.voiceActions .btn{flex:1;padding:11px 6px;font-size:13px}

#fuzzyMask{position:fixed;inset:0;background:rgba(20,24,38,.3);display:none;align-items:center;justify-content:center;z-index:500;padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#fuzzyMask.show{display:flex}
#fuzzyPanel{
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.72));
  border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);max-width:480px;width:100%;padding:22px;
  box-shadow:0 20px 60px rgba(31,38,135,.32), inset 0 1px 0 rgba(255,255,255,.95);
  max-height:88vh;display:flex;flex-direction:column;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
}
#fuzzyPanel h3{margin:0 0 8px;font-size:17px;color:var(--accent)}
.fuzzyHint{font-size:12px;color:var(--ink-3);line-height:1.7;margin-bottom:10px}
.fuzzyHint strong{color:var(--accent)}
#fuzzyInput{font-family:monospace;background:rgba(10,132,255,.08);padding:2px 6px;border-radius:6px;color:#b02a37;font-weight:700;word-break:break-all}
#fuzzyList{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.fuzzyItem{
  display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;
  border:1px solid var(--glass-border);border-radius:var(--radius-md);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.55));
  cursor:pointer;font-family:inherit;
  box-shadow:var(--glass-shadow-sm);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  transition:transform .18s ease;
}
.fuzzyItem:active{transform:scale(.985)}
.fuzzyItem.selected{border-color:rgba(10,132,255,.55);background:linear-gradient(180deg,rgba(230,242,255,.95),rgba(212,231,255,.75))}
.fuzzyItemText{font-size:16px;font-weight:700;color:var(--ink);word-break:break-all;margin-bottom:4px;font-family:monospace}
.fuzzyItemMeta{font-size:11px;color:var(--ink-3)}
.fuzzyItemMeta .score-high{color:var(--ok);font-weight:700}
.fuzzyItemMeta .score-mid{color:var(--warn);font-weight:700}
#fuzzyEmpty{padding:20px;text-align:center;color:#a3231b;background:linear-gradient(180deg,rgba(255,236,235,.9),rgba(255,224,222,.7));border:1px solid rgba(255,59,48,.2);border-radius:14px;font-size:13px;line-height:1.7;margin-bottom:10px}
.fuzzyActions{display:flex;gap:8px}
.fuzzyActions .btn{flex:1;padding:12px 6px;font-size:13px}
</style>
</head>
<body>
<div id="loadStatus">
<div class="spinner"></div>
<div id="loadText">正在加载组件，请稍候…</div>
<button class="btn btn-primary" id="loadRetry" onclick="location.reload()">加载失败，点击重试</button>
</div>

<header>
<h1>飞利浦送货</h1>
<span class="badge" id="colBadge" style="display:none"></span>
</header>

<main>
<div id="restoreBanner">
<span id="restoreText">💾 已恢复上次核对进度</span>
<span class="spacer"></span>
